; PI7 · banco de pruebas del robot (ESP-IDF sobre PlatformIO)
; Un solo firmware: al arrancar muestra un menú y se elige el test (t01 ... t09).
[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; El firmware hace eco de lo que se escribe: no hace falta eco local.
monitor_echo = no
monitor_eol = LF
